openapi: 3.0.3
info:
  title: Wallet API
  version: "1.0.0"
  description: |
    Versioned REST API for the wallet platform.

    **Money** is always a decimal string in major units plus an ISO 4217 code
    (`{"amount": "5000.00", "currency": "KES"}`). Never send or parse money as a
    JSON number. KES has 2 decimal places; mobile-money operations accept whole
    shillings only.

    **Idempotency**: `POST /deposits`, `POST /transfers` and `POST /withdrawals`
    require an `Idempotency-Key` header (8-128 chars `[A-Za-z0-9_-]`). Generate a
    new key per logical payment and reuse it for retries of that payment. A
    replay returns the original resource with `Idempotent-Replayed: true`.
    Reusing a key with different parameters returns `idempotency_key_reused`.
    Keys are retained for 7 days.

    **Transaction states**: each resource carries its precise `status` plus a
    customer-facing `display_status` of `pending`, `succeeded`, `failed`,
    `reversed` or `unknown`. `unknown` means the provider outcome is not yet
    confirmed; it is not a failure and funds stay held until resolved.

    **Errors** use `{"error": {"code", "message", "fields?", "request_id"}}`.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Profile
  - name: Wallets
  - name: Payments
  - name: Statements
  - name: Notifications
  - name: Callbacks
  - name: Admin
  - name: Ops

paths:
  /healthz:
    get:
      tags: [Ops]
      security: []
      summary: Liveness
      responses: { "200": { description: OK } }
  /readyz:
    get:
      tags: [Ops]
      security: []
      summary: Readiness (database, redis)
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /api/v1/meta:
    get:
      tags: [Ops]
      security: []
      summary: Payment mode, providers and capabilities
      responses: { "200": { description: OK } }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register (creates user and KES wallet) and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, full_name, password]
              additionalProperties: false
              properties:
                phone: { type: string, example: "0712345678" }
                email: { type: string, format: email }
                full_name: { type: string, minLength: 2, maxLength: 120 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "201": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in with phone and password (lockout after 5 failures)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token. Reusing a rotated token revokes the session family.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses: { "204": { description: Revoked } }
  /api/v1/auth/verify-phone:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: "^[0-9]{6}$" } } } } }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/auth/verify-phone/resend:
    post:
      tags: [Auth]
      responses: { "202": { description: Code sent }, "429": { $ref: "#/components/responses/Error" } }
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Always 202 (does not reveal registration)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string } } } } }
      responses: { "202": { description: Accepted } }
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, new_password]
              properties:
                phone: { type: string }
                code: { type: string }
                new_password: { type: string, minLength: 10 }
      responses: { "204": { description: Reset; all sessions revoked }, "422": { $ref: "#/components/responses/Error" } }

  /api/v1/me:
    get:
      tags: [Profile]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } } }
  /api/v1/me/pin:
    post:
      tags: [Profile]
      summary: Set or change the transaction PIN (requires password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, pin]
              properties:
                password: { type: string }
                pin: { type: string, pattern: "^[0-9]{4,6}$" }
      responses: { "204": { description: Set }, "422": { $ref: "#/components/responses/Error" } }
  /api/v1/me/password:
    post:
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses: { "204": { description: Changed; other sessions revoked } }
  /api/v1/limits:
    get:
      tags: [Profile]
      summary: KYC tier, limits, today's usage and fee rules
      responses: { "200": { description: OK } }
  /api/v1/fees/quote:
    get:
      tags: [Payments]
      summary: Fee and total for a prospective operation
      parameters:
        - { name: operation, in: query, required: true, schema: { type: string, enum: [deposit, transfer, withdrawal] } }
        - { name: amount, in: query, required: true, schema: { type: string, example: "1000" } }
        - { name: provider, in: query, schema: { type: string, enum: [mpesa, airtel] } }
        - { name: currency, in: query, schema: { type: string, default: KES } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation: { type: string }
                  amount: { $ref: "#/components/schemas/Money" }
                  fee: { $ref: "#/components/schemas/Money" }
                  total: { $ref: "#/components/schemas/Money" }

  /api/v1/wallets:
    get:
      tags: [Wallets]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Wallet" } } } } } }
  /api/v1/wallets/{walletID}:
    get:
      tags: [Wallets]
      parameters: [{ $ref: "#/components/parameters/WalletID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/wallets/{walletID}/balance:
    get:
      tags: [Wallets]
      summary: Ledger-derived balances (server authoritative)
      parameters: [{ $ref: "#/components/parameters/WalletID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Balance" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/wallets/{walletID}/transactions:
    get:
      tags: [Wallets]
      parameters:
        - { $ref: "#/components/parameters/WalletID" }
        - { $ref: "#/components/parameters/ActivityType" }
        - { $ref: "#/components/parameters/ActivityStatus" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Q" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ActivityPage" } } } }
  /api/v1/transactions:
    get:
      tags: [Wallets]
      summary: Activity for the caller's primary wallet
      parameters:
        - { $ref: "#/components/parameters/ActivityType" }
        - { $ref: "#/components/parameters/ActivityStatus" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Q" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ActivityPage" } } } }
  /api/v1/transactions/{transactionID}:
    get:
      tags: [Wallets]
      summary: Transaction detail / receipt
      parameters: [{ name: transactionID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction: { $ref: "#/components/schemas/Activity" }
                  receipt_number: { type: string }
                  wallet_account: { type: string }
                  deposit: { $ref: "#/components/schemas/Deposit" }
                  withdrawal: { $ref: "#/components/schemas/Withdrawal" }
                  transfer: { $ref: "#/components/schemas/Transfer" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/deposits:
    post:
      tags: [Payments]
      summary: Start a mobile-money collection (STK / USSD push)
      description: |
        Returns 202 with status `created`. The wallet is credited only after
        the provider confirms through an authenticated status check. Poll
        `GET /deposits/{id}` until `display_status` is terminal.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, phone, amount]
              additionalProperties: false
              properties:
                provider: { type: string, enum: [mpesa, airtel] }
                phone: { type: string }
                amount: { type: string, example: "5000" }
                currency: { type: string, default: KES }
      responses:
        "202": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Deposit" } } } }
        "200": { description: Idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/Deposit" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/deposits/{depositID}:
    get:
      tags: [Payments]
      parameters: [{ name: depositID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Deposit" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/transfers:
    post:
      tags: [Payments]
      summary: Atomic wallet-to-wallet transfer (PIN required)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, pin]
              additionalProperties: false
              description: Exactly one of recipient_phone or recipient_account.
              properties:
                recipient_phone: { type: string }
                recipient_account: { type: string, pattern: "^[0-9]{12}$" }
                amount: { type: string }
                currency: { type: string, default: KES }
                description: { type: string, maxLength: 140 }
                pin: { type: string }
      responses:
        "201": { description: Completed, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "200": { description: Idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "401": { description: invalid_pin, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { description: validation_error / insufficient_funds / limit_exceeded / idempotency_key_reused, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: pin_locked, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "428": { description: pin_not_set, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/transfers/{transferID}:
    get:
      tags: [Payments]
      parameters: [{ name: transferID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/recipients/lookup:
    get:
      tags: [Payments]
      summary: Resolve a recipient (masked name and phone only)
      parameters:
        - { name: phone, in: query, schema: { type: string } }
        - { name: account_number, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  display_name: { type: string, example: "Amina O." }
                  phone_masked: { type: string, example: "+254 723 ••• 114" }
                  account_number: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/withdrawals:
    post:
      tags: [Payments]
      summary: Pay out to the account holder's registered mobile number (PIN required)
      description: Funds (amount + fee) are held immediately and settled or released when the provider outcome is confirmed.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, amount, pin]
              additionalProperties: false
              properties:
                provider: { type: string, enum: [mpesa, airtel] }
                amount: { type: string }
                currency: { type: string, default: KES }
                pin: { type: string }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }
        "200": { description: Idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/withdrawals/{withdrawalID}:
    get:
      tags: [Payments]
      parameters: [{ name: withdrawalID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }

  /api/v1/statements:
    get:
      tags: [Statements]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Statement" } } } } } } } }
    post:
      tags: [Statements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, format]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                format: { type: string, enum: [csv, pdf] }
      responses:
        "201": { description: Generated, content: { application/json: { schema: { $ref: "#/components/schemas/Statement" } } } }
  /api/v1/statements/{statementID}/download:
    get:
      tags: [Statements]
      parameters: [{ name: statementID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: File
          content:
            text/csv: { schema: { type: string } }
            application/pdf: { schema: { type: string, format: binary } }

  /api/v1/notifications:
    get:
      tags: [Notifications]
      parameters:
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: OK } }
  /api/v1/notifications/read:
    post:
      tags: [Notifications]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid, nullable: true, description: "omit to mark all read" } } } } }
      responses: { "204": { description: OK } }

  /api/v1/callbacks/mpesa/{token}/stk:
    post:
      tags: [Callbacks]
      security: []
      summary: Daraja STK Push callback (unsigned; treated as a hint, confirmed by STK Query)
      parameters: [{ $ref: "#/components/parameters/CallbackToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: '{"ResultCode":0,"ResultDesc":"Accepted"}' }, "404": { description: Unknown token } }
  /api/v1/callbacks/mpesa/{token}/b2c/result:
    post:
      tags: [Callbacks]
      security: []
      summary: Daraja B2C result (applied only when ConversationID, OriginatorConversationID and amount match)
      parameters: [{ $ref: "#/components/parameters/CallbackToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Accepted } }
  /api/v1/callbacks/mpesa/{token}/b2c/timeout:
    post:
      tags: [Callbacks]
      security: []
      summary: Daraja B2C queue timeout (marks payout outcome uncertain; funds stay held)
      parameters: [{ $ref: "#/components/parameters/CallbackToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Accepted } }
  /api/v1/callbacks/airtel/{token}:
    post:
      tags: [Callbacks]
      security: []
      summary: Airtel Money callback (hint only; confirmed by Transaction Enquiry)
      parameters: [{ $ref: "#/components/parameters/CallbackToken" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Accepted } }

  /api/v1/admin/dashboard:
    get: { tags: [Admin], summary: "Operational summary (support, admin)", responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Error" } } }
  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: Search users (support, admin; audited)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses: { "200": { description: OK } }
  /api/v1/admin/users/{userID}:
    get:
      tags: [Admin]
      parameters: [{ name: userID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: User with wallets and projected vs derived balances } }
  /api/v1/admin/users/{userID}/status:
    post:
      tags: [Admin]
      summary: Restrict / suspend / close / reactivate (admin; audited)
      parameters: [{ name: userID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [active, restricted, suspended, closed] }
                reason: { type: string }
      responses: { "200": { description: OK } }
  /api/v1/admin/wallets/{walletID}/transactions:
    get:
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/WalletID" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ActivityPage" } } } } }
  /api/v1/admin/payments:
    get:
      tags: [Admin]
      summary: Monitor deposits and withdrawals
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [deposit, withdrawal] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: needs_review, in: query, schema: { type: boolean } }
      responses: { "200": { description: OK } }
  /api/v1/admin/transfers/{transferID}:
    get:
      tags: [Admin]
      parameters: [{ name: transferID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK } }
  /api/v1/admin/deposits/{depositID}/recheck:
    post:
      tags: [Admin]
      summary: Schedule an authenticated provider status check (never changes state by itself)
      parameters: [{ name: depositID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "202": { description: Scheduled } }
  /api/v1/admin/withdrawals/{withdrawalID}/recheck:
    post:
      tags: [Admin]
      parameters: [{ name: withdrawalID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "202": { description: Scheduled } }
  /api/v1/admin/withdrawals/{withdrawalID}/resolve:
    post:
      tags: [Admin]
      summary: Resolve an uncertain payout from provider evidence (admin; audited)
      parameters: [{ name: withdrawalID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, evidence]
              properties:
                outcome: { type: string, enum: [succeeded, failed] }
                provider_receipt: { type: string, description: required when succeeded }
                evidence: { type: string, minLength: 10 }
      responses: { "200": { description: OK } }
  /api/v1/admin/financial-requests:
    get:
      tags: [Admin]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [pending_approval, rejected, posted, failed] } }]
      responses: { "200": { description: OK } }
    post:
      tags: [Admin]
      summary: Request an adjustment or reversal (maker)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason_code, memo]
              properties:
                kind: { type: string, enum: [adjustment_credit, adjustment_debit, transfer_reversal, deposit_reversal, withdrawal_reversal] }
                wallet_id: { type: string, format: uuid }
                target_id: { type: string, format: uuid }
                amount: { type: string }
                currency: { type: string }
                reason_code: { type: string, enum: [provider_reversal, customer_dispute, operational_error, fraud, goodwill, reconciliation_correction] }
                memo: { type: string, minLength: 10, maxLength: 1000 }
      responses: { "201": { description: Pending approval } }
  /api/v1/admin/financial-requests/{requestID}/approve:
    post:
      tags: [Admin]
      summary: Approve and post (checker; must differ from requester)
      parameters: [{ name: requestID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses: { "200": { description: Posted }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/financial-requests/{requestID}/reject:
    post:
      tags: [Admin]
      parameters: [{ name: requestID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses: { "200": { description: Rejected } }
  /api/v1/admin/settings/fees:
    get: { tags: [Admin], responses: { "200": { description: All fee rule versions } } }
    post:
      tags: [Admin]
      summary: Add a new fee rule version (rules are never edited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, reason]
              properties:
                operation: { type: string, enum: [deposit, transfer, withdrawal] }
                provider: { type: string, default: "*" }
                currency: { type: string }
                flat_fee: { type: string }
                rate_bps: { type: integer, minimum: 0, maximum: 10000 }
                min_fee: { type: string }
                max_fee: { type: string, nullable: true }
                effective_from: { type: string, format: date-time }
                reason: { type: string }
      responses: { "201": { description: Created } }
  /api/v1/admin/settings/limits:
    get: { tags: [Admin], responses: { "200": { description: All limit rule versions } } }
    post:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kyc_tier, operation, per_transaction_min, per_transaction_max, daily_max, reason]
              properties:
                kyc_tier: { type: integer, minimum: 0, maximum: 3 }
                operation: { type: string, enum: [deposit, transfer, withdrawal] }
                currency: { type: string }
                per_transaction_min: { type: string }
                per_transaction_max: { type: string }
                daily_max: { type: string }
                effective_from: { type: string, format: date-time }
                reason: { type: string }
      responses: { "201": { description: Created } }
  /api/v1/admin/reconciliation/runs:
    get: { tags: [Admin], responses: { "200": { description: OK } } }
    post: { tags: [Admin], summary: Run internal reconciliation now, responses: { "201": { description: Run } } }
  /api/v1/admin/reconciliation/statements:
    post:
      tags: [Admin]
      summary: Import a normalized provider statement CSV
      parameters: [{ name: provider, in: query, required: true, schema: { type: string, enum: [mpesa, airtel] } }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, example: "provider,receipt,reference,direction,amount,currency,status,occurred_at" }
      responses: { "201": { description: Run } }
  /api/v1/admin/reconciliation/items:
    get:
      tags: [Admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, investigating, resolved, dismissed] } }
        - { name: discrepancy, in: query, schema: { type: string } }
      responses: { "200": { description: OK } }
  /api/v1/admin/reconciliation/items/{itemID}:
    post:
      tags: [Admin]
      summary: Record investigation progress / resolution (does not move money)
      parameters: [{ name: itemID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [investigating, resolved, dismissed] }
                note: { type: string }
      responses: { "200": { description: OK } }
  /api/v1/admin/audit-events:
    get:
      tags: [Admin]
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: before_id, in: query, schema: { type: integer } }
      responses: { "200": { description: OK } }
  /api/v1/admin/providers/health:
    get: { tags: [Admin], responses: { "200": { description: Per-provider 24h stats and capabilities } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    WalletID: { name: walletID, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" } }
    CallbackToken: { name: token, in: path, required: true, schema: { type: string } }
    ActivityType: { name: type, in: query, schema: { type: string, description: "comma list of deposit, withdrawal, transfer, transfer_in, transfer_out, adjustment" } }
    ActivityStatus: { name: status, in: query, schema: { type: string, description: "comma list of pending, succeeded, failed, reversed, expired" } }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Q: { name: q, in: query, schema: { type: string, maxLength: 64 }, description: Search counterparty, reference, description or id }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$", example: "5000.00" }
        currency: { type: string, example: KES }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_error, unauthenticated, forbidden, not_found, conflict, insufficient_funds, limit_exceeded,
                     account_restricted, idempotency_key_reused, idempotency_request_in_progress, idempotency_key_required,
                     invalid_pin, pin_locked, pin_not_set, rate_limited, provider_unavailable, invalid_state, internal_error]
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            request_id: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: { refresh_token: { type: string } }
    Session:
      type: object
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        token_type: { type: string, example: Bearer }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        email: { type: string, nullable: true }
        full_name: { type: string }
        role: { type: string, enum: [user, support, admin] }
        status: { type: string, enum: [pending_verification, active, restricted, suspended, closed] }
        kyc_tier: { type: integer }
        phone_verified_at: { type: string, format: date-time, nullable: true }
        has_pin: { type: boolean }
    Wallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_number: { type: string }
        currency: { type: string }
        status: { type: string, enum: [active, frozen, closed] }
        created_at: { type: string, format: date-time }
    Balance:
      type: object
      properties:
        wallet_id: { type: string, format: uuid }
        available: { $ref: "#/components/schemas/Money" }
        held: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        pending_inbound: { $ref: "#/components/schemas/Money" }
        as_of: { type: string, format: date-time }
    DisplayStatus: { type: string, enum: [pending, succeeded, failed, reversed, unknown] }
    Deposit:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        provider: { type: string }
        provider_environment: { type: string, enum: [simulated, sandbox, production] }
        simulated: { type: boolean }
        phone_masked: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [created, pending_provider, succeeded, failed, expired, reversed] }
        display_status: { $ref: "#/components/schemas/DisplayStatus" }
        provider_status: { type: string, enum: [not_sent, sending, accepted, rejected, unknown, completed, failed] }
        provider_receipt: { type: string, nullable: true }
        failure_reason: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    Withdrawal:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        provider_environment: { type: string }
        simulated: { type: boolean }
        phone_masked: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [created, pending, processing, succeeded, failed, reversed] }
        display_status: { $ref: "#/components/schemas/DisplayStatus" }
        outcome_uncertain: { type: boolean }
        provider_receipt: { type: string, nullable: true }
        failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [debit, credit] }
        counterparty_name: { type: string }
        counterparty_account: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [created, processing, succeeded, failed, reversed] }
        display_status: { $ref: "#/components/schemas/DisplayStatus" }
        description: { type: string }
        created_at: { type: string, format: date-time }
    Activity:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        type: { type: string, enum: [deposit, withdrawal, transfer_in, transfer_out, adjustment] }
        direction: { type: string, enum: [credit, debit] }
        amount: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        status: { type: string }
        display_status: { $ref: "#/components/schemas/DisplayStatus" }
        provider: { type: string, nullable: true }
        counterparty: { type: string, nullable: true }
        counterparty_detail: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        description: { type: string }
        failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    ActivityPage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        next_cursor: { type: string, nullable: true }
    Statement:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        format: { type: string, enum: [csv, pdf] }
        sha256: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
